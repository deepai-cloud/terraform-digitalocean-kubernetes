name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Release Please
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release bootstrap
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_count=$(gh release list --limit 1 --json tagName --jq 'length')
          if [ "$release_count" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publish the initial version tag to bootstrap Release Please."
          fi
      - uses: googleapis/release-please-action@v4
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tagged-release:
    name: Publish tagged release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag (vX.Y.Z)."
            exit 1
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
